[package]
name = "yomitan-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "sqlite"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
zip = "8.6.0"
